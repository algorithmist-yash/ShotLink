name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check backend source syntax
        run: npm run check

      - name: Validate OpenAPI route coverage
        run: npm run test:contracts

      - name: Run backend tests with coverage thresholds
        run: npm run test:coverage

      - name: Run MongoDB-backed API integration tests
        env:
          MONGOMS_VERSION: 8.2.6
        run: npm run test:integration

      - name: Run controller-specific coverage gate
        env:
          MONGOMS_VERSION: 8.2.6
        run: npm run test:coverage:controllers

      - name: Run deterministic load smoke gate
        env:
          MONGOMS_VERSION: 8.2.6
        run: npm run test:load

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install E2E backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        env:
          MONGOMS_VERSION: 8.2.6
        run: npm run test:e2e

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Container and operations validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag shotlink-backend:ci backend

      - name: Build frontend image
        run: docker build --tag shotlink-frontend:ci frontend

      - name: Validate Prometheus rules and configuration
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/shotlink:ro" prom/prometheus:v3.13.1 check rules /etc/shotlink/shotlink.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/shotlink:ro" prom/prometheus:v3.13.1 check config /etc/shotlink/prometheus.yml
