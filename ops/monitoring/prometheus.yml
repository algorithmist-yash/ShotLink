global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - shotlink.rules.yml

scrape_configs:
  - job_name: shotlink-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/shotlink_metrics_token
    static_configs:
      - targets: ["shotlink-api.internal:5000"]
